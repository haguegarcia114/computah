<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YHK Thermal Photobooth</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #121212;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    h1 {
      font-size: 1.5rem;
      margin-bottom: 15px;
      color: #e0e0e0;
    }
    /* Thermal Canvas Container */
    .preview-container {
      position: relative;
      background-color: #f8f6f0; /* Receipt paper tint */
      padding: 10px;
      border-radius: 8px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
      margin-bottom: 20px;
    }
    canvas {
      display: block;
      width: 100%;
      max-width: 384px;
      height: auto;
      border: 1px solid #ccc;
      image-rendering: pixelated; /* Sharp dither dots */
    }
    .controls {
      display: flex;
      gap: 12px;
      width: 100%;
      max-width: 384px;
    }
    button {
      flex: 1;
      padding: 14px;
      font-size: 1rem;
      font-weight: bold;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }
    .btn-snap {
      background-color: #3b82f6;
      color: white;
    }
    .btn-snap:active {
      background-color: #2563eb;
    }
    .btn-print {
      background-color: #10b981;
      color: white;
    }
    .btn-print:active {
      background-color: #059669;
    }
    #status {
      margin-top: 15px;
      font-size: 0.85rem;
      color: #aaa;
      text-align: center;
      max-width: 384px;
    }
  </style>
</head>
<body>

  <h1>YHK Photobooth</h1>

  <!-- Hidden webcam source -->
  <video id="webcam" autoplay playsinline style="display: none;"></video>

  <!-- Visible Dithered Canvas -->
  <div class="preview-container">
    <canvas id="previewCanvas" width="384" height="512"></canvas>
  </div>

  <div class="controls">
    <button id="snapBtn" class="btn-snap" onclick="toggleFreeze()">Freeze</button>
    <button class="btn-print" onclick="connectAndPrint()">Print</button>
  </div>

  <div id="status">Status: Initializing camera...</div>

  <script>
    const video = document.getElementById('webcam');
    const canvas = document.getElementById('previewCanvas');
    const ctx = canvas.getContext('2d');
    const statusEl = document.getElementById('status');
    const snapBtn = document.getElementById('snapBtn');

    let isFrozen = false;
    let animFrameId = null;
    let savedPrinterDevice = null;

    function logStatus(msg) {
      statusEl.textContent = "Status: " + msg;
      console.log("[Photobooth]", msg);
    }

    // --- 1. Real-Time Dithered Camera Engine ---
    async function initCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { width: { ideal: 384 }, height: { ideal: 512 }, facingMode: 'user' }
        });
        video.srcObject = stream;
        video.onloadedmetadata = () => {
          video.play();
          renderLoop();
          logStatus("Camera Ready");
        };
      } catch (err) {
        logStatus("Camera Error: " + err.message);
      }
    }

    function toggleFreeze() {
      isFrozen = !isFrozen;
      if (isFrozen) {
        snapBtn.textContent = "Resume";
        cancelAnimationFrame(animFrameId);
        logStatus("Frame Captured");
      } else {
        snapBtn.textContent = "Freeze";
        renderLoop();
        logStatus("Camera Live");
      }
    }

    function renderLoop() {
      if (isFrozen) return;

      // Draw camera frame scaled to 384px width
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

      // Apply Floyd-Steinberg 1-Bit Dithering
      const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const data = imgData.data;
      const w = imgData.width;
      const h = imgData.height;

      // Grayscale pass
      for (let i = 0; i < data.length; i += 4) {
        const gray = 0.299 * data[i] + 0.587 * data[i + 1] + 0.114 * data[i + 2];
        data[i] = gray;
        data[i + 1] = gray;
        data[i + 2] = gray;
      }

      // Dithering pass
      for (let y = 0; y < h; y++) {
        for (let x = 0; x < w; x++) {
          const idx = (y * w + x) * 4;
          const oldPixel = data[idx];
          const newPixel = oldPixel < 128 ? 0 : 255;

          data[idx] = newPixel;
          data[idx + 1] = newPixel;
          data[idx + 2] = newPixel;

          const err = oldPixel - newPixel;

          if (x + 1 < w) data[idx + 4] += err * (7 / 16);
          if (x - 1 >= 0 && y + 1 < h) data[idx + (w - 1) * 4] += err * (3 / 16);
          if (y + 1 < h) data[idx + w * 4] += err * (5 / 16);
          if (x + 1 < w && y + 1 < h) data[idx + (w + 1) * 4] += err * (1 / 16);
        }
      }

      ctx.putImageData(imgData, 0, 0);
      animFrameId = requestAnimationFrame(renderLoop);
    }

    // --- 2. ESC/POS Raster Payload Generator ---
    function buildYHKRasterPayload() {
      const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const pixels = imgData.data;
      const w = canvas.width;  // 384
      const h = canvas.height; // 512
      const bytesPerRow = w / 8; // 48 bytes per line

      const rasterData = [];

      // Header: GS v 0 0 [xL] [xH] [yL] [yH]
      rasterData.push(0x1D, 0x76, 0x30, 0x00);
      rasterData.push(bytesPerRow & 0xFF, (bytesPerRow >> 8) & 0xFF);
      rasterData.push(h & 0xFF, (h >> 8) & 0xFF);

      // Pack 8 1-bit pixels into 1 byte
      for (let y = 0; y < h; y++) {
        for (let x = 0; x < w; x += 8) {
          let byte = 0;
          for (let bit = 0; bit < 8; bit++) {
            const idx = (y * w + (x + bit)) * 4;
            // Black pixel in thermal = 1 bit
            if (pixels[idx] < 128) {
              byte |= (1 << (7 - bit));
            }
          }
          rasterData.push(byte);
        }
      }

      return new Uint8Array(rasterData);
    }

    // --- 3. Web Bluetooth Communication Engine ---
    async function connectAndPrint() {
      try {
        let device = savedPrinterDevice;

        // Auto-detect previously granted devices
        if (!device && navigator.bluetooth.getDevices) {
          const existing = await navigator.bluetooth.getDevices();
          if (existing.length > 0) {
            device = existing[0];
            logStatus("Connecting to saved printer...");
          }
        }

        const targetServices = [
          '49535343-fe7d-4ae5-8fa9-9fafd205e455',
          '0000e004-0000-1000-8000-00805f9b34fb',
          '0000fef5-0000-1000-8000-00805f9b34fb',
          '000018f0-0000-1000-8000-00805f9b34fb',
          '0000ff00-0000-1000-8000-00805f9b34fb'
        ];

        // Request device if none cached
        if (!device) {
          logStatus("Scanning for Bluetooth Printer...");
          device = await navigator.bluetooth.requestDevice({
            filters: [
              { namePrefix: 'YHK' },
              { namePrefix: 'Walk' },
              { namePrefix: 'MX' },
              { namePrefix: 'GB' }
            ],
            optionalServices: targetServices
          });
        }

        savedPrinterDevice = device;

        if (!device.gatt.connected) {
          logStatus("Establishing GATT connection...");
          await device.gatt.connect();
          await new Promise(r => setTimeout(r, 400)); // Mobile BLE delay
        }

        // Find writable GATT characteristic
        let writeChar = null;
        for (const uuid of targetServices) {
          try {
            const service = await device.gatt.getPrimaryService(uuid);
            const chars = await service.getCharacteristics();
            for (const c of chars) {
              if (c.properties.write || c.properties.writeWithoutResponse) {
                writeChar = c;
                break;
              }
            }
          } catch (e) {
            continue;
          }
          if (writeChar) break;
        }

        if (!writeChar) {
          throw new Error("No writable GATT channel found. Cycle printer power.");
        }

        // Send Init & Density Header
        logStatus("Sending print header...");
        const initCmd = new Uint8Array([0x1B, 0x40, 0x1D, 0x49, 0xF0, 0xFF]);
        await sendData(writeChar, initCmd);

        // Stream Raster Payload
        logStatus("Printing thermal image...");
        const payload = buildYHKRasterPayload();
        const CHUNK_SIZE = 20;

        for (let i = 0; i < payload.length; i += CHUNK_SIZE) {
          const chunk = payload.slice(i, i + CHUNK_SIZE);
          await sendData(writeChar, chunk);
          await new Promise(r => setTimeout(r, 8)); // Chunk pacing delay
        }

        // Send Paper Feed Command
        logStatus("Feeding paper...");
        const feedCmd = new Uint8Array([0x1B, 0x64, 0x04]);
        await sendData(writeChar, feedCmd);

        logStatus("Print Job Complete!");

      } catch (err) {
        logStatus("Print Error: " + err.message);
        savedPrinterDevice = null;
        console.error(err);
      }
    }

    async function sendData(char, data) {
      if (char.properties.writeWithoutResponse) {
        await char.writeValueWithoutResponse(data);
      } else {
        await char.writeValue(data);
      }
    }

    // Start system
    initCamera();
  </script>
</body>
</html>
