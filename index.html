<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>untitled - Paint</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    :root {
      --win-bg: #c0c0c0;
      --win-border-light: #ffffff;
      --win-border-dark: #808080;
      --win-border-darker: #000000;
      --navy: #000080;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "MS Sans Serif", "Courier New", monospace;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background-color: #008080;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      padding: 6px;
    }

    .window {
      background: var(--win-bg);
      border: 2px solid;
      border-color: var(--win-border-light) var(--win-border-dark) var(--win-border-dark) var(--win-border-light);
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      padding: 2px;
    }

    .title-bar {
      background: var(--navy);
      color: white;
      padding: 2px 4px;
      font-weight: bold;
      font-size: 13px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .title-controls span {
      display: inline-block;
      width: 14px;
      height: 14px;
      background: var(--win-bg);
      color: black;
      text-align: center;
      line-height: 11px;
      border: 1px solid;
      border-color: var(--win-border-light) var(--win-border-dark) var(--win-border-dark) var(--win-border-light);
      font-size: 10px;
      margin-left: 2px;
    }

    .menu-bar {
      display: flex;
      gap: 12px;
      padding: 2px 6px;
      font-size: 12px;
      border-bottom: 1px solid var(--win-border-dark);
    }

    .main-body {
      display: flex;
      flex: 1;
      margin-top: 2px;
      gap: 4px;
      overflow: hidden;
    }

    .tools-sidebar {
      width: 56px;
      background: var(--win-bg);
      display: grid;
      grid-template-columns: repeat(2, 25px);
      grid-auto-rows: 25px;
      gap: 2px;
      padding: 2px;
      border: 1px solid var(--win-border-dark);
    }

    .tool-box {
      background: var(--win-bg);
      border: 1px solid;
      border-color: var(--win-border-light) var(--win-border-dark) var(--win-border-dark) var(--win-border-light);
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 12px;
      pointer-events: none;
    }

    .viewport {
      flex: 1;
      background: #808080;
      border: 2px inset var(--win-border-light);
      display: flex;
      justify-content: center;
      align-items: flex-start;
      overflow: auto;
      padding: 10px;
    }

    canvas {
      background: #ffffff;
      border: 1px solid #000;
      box-shadow: 3px 3px 6px rgba(0,0,0,0.4);
      width: 384px;
      height: auto;
      image-rendering: pixelated;
    }

    #hiddenVideo {
      display: none;
    }

    #qrcode {
      display: none;
    }

    .control-panel {
      width: 200px;
      background: var(--win-bg);
      border: 1px solid var(--win-border-dark);
      padding: 6px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .panel-section {
      border: 2px inset var(--win-border-light);
      padding: 6px;
      background: #d4d4d4;
    }

    .panel-title {
      font-size: 11px;
      font-weight: bold;
      margin-bottom: 4px;
    }

    .checkbox-label {
      font-size: 11px;
      font-weight: bold;
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      margin-top: 4px;
    }

    button {
      background: var(--win-bg);
      border: 2px solid;
      border-color: var(--win-border-light) var(--win-border-dark) var(--win-border-dark) var(--win-border-light);
      padding: 6px;
      font-weight: bold;
      font-size: 11px;
      cursor: pointer;
      width: 100%;
    }

    button:active {
      border-color: var(--win-border-dark) var(--win-border-light) var(--win-border-light) var(--win-border-dark);
    }

    .btn-snap {
      background: #000080;
      color: white;
      height: 38px;
    }

    .btn-print {
      background: #008000;
      color: white;
      height: 42px;
      font-size: 13px;
    }

    .status-text {
      font-size: 10px;
      background: white;
      border: 1px inset var(--win-border-dark);
      padding: 4px;
      height: 50px;
      overflow-y: auto;
    }

    .color-bar {
      height: 32px;
      background: var(--win-bg);
      border-top: 1px solid var(--win-border-dark);
      display: flex;
      align-items: center;
      padding: 2px;
      gap: 2px;
    }

    .active-color-box {
      width: 28px;
      height: 24px;
      border: 2px inset var(--win-border-light);
      background: #000;
    }

    .swatches {
      display: grid;
      grid-template-rows: repeat(2, 11px);
      grid-auto-flow: column;
      gap: 1px;
    }

    .swatch {
      width: 11px;
      height: 11px;
      border: 1px solid #808080;
    }
  </style>
</head>
<body>

  <div class="window">
    <div class="title-bar">
      <span>untitled - Paint</span>
      <div class="title-controls">
        <span>_</span>
        <span>□</span>
        <span>X</span>
      </div>
    </div>

    <div class="menu-bar">
      <span>File</span>
      <span>Edit</span>
      <span>View</span>
      <span>Image</span>
      <span>Options</span>
      <span>Help</span>
    </div>

    <div class="main-body">
      <div class="tools-sidebar">
        <div class="tool-box">✂️</div>
        <div class="tool-box">✂️</div>
        <div class="tool-box">🧹</div>
        <div class="tool-box">🪣</div>
        <div class="tool-box">👁️</div>
        <div class="tool-box">🔍</div>
        <div class="tool-box">✏️</div>
        <div class="tool-box">🖌️</div>
        <div class="tool-box">💨</div>
        <div class="tool-box"><b>A</b></div>
        <div class="tool-box">╲</div>
        <div class="tool-box">∿</div>
        <div class="tool-box">▭</div>
        <div class="tool-box">⬡</div>
        <div class="tool-box">◯</div>
        <div class="tool-box">▢</div>
      </div>

      <div class="viewport">
        <canvas id="photoCanvas" width="384" height="600"></canvas>
      </div>

      <video id="hiddenVideo" autoplay playsinline muted style="display:none;"></video>
      <div id="qrcode"></div>

      <div class="control-panel">
        <div class="panel-section">
          <div class="panel-title">1. Photo Layout</div>
          <select id="photoCountSelect" onchange="changeLayout()" style="width: 100%; padding: 4px; font-weight: bold;">
            <option value="1">1 Photo Strip</option>
            <option value="2">2 Photos Stacked</option>
            <option value="3" selected>3 Photos Stacked</option>
            <option value="4">4 Photos Stacked</option>
          </select>

          <!-- Toggle Animation Control -->
          <label class="checkbox-label">
            <input type="checkbox" id="toggleAnim" onchange="toggleAnimation(this)"> Freeze Preview
          </label>

          <!-- Toggle Pixel Dithering Control -->
          <label class="checkbox-label">
            <input type="checkbox" id="toggleDither" checked onchange="toggleDithering(this)"> Pixel Dithering
          </label>
        </div>

        <div class="panel-section">
          <div class="panel-title">2. Capture</div>
          <button class="btn-snap" onclick="snapPhoto()">📸 SNAP NEXT</button>
          <button style="margin-top: 4px;" onclick="resetPhotos()">🔄 Reset Canvas</button>
        </div>

        <div class="panel-section">
          <div class="panel-title">3. Thermal Print</div>
          <button class="btn-print" onclick="connectAndPrint()">🖨️ PRINT</button>
        </div>

        <div class="status-text" id="statusBox">Status: Select layout and snap photos.</div>
      </div>
    </div>

    <div class="color-bar">
      <div class="active-color-box"></div>
      <div class="swatches">
        <div class="swatch" style="background:#000000"></div>
        <div class="swatch" style="background:#808080"></div>
        <div class="swatch" style="background:#800000"></div>
        <div class="swatch" style="background:#808000"></div>
        <div class="swatch" style="background:#008000"></div>
        <div class="swatch" style="background:#008080"></div>
        <div class="swatch" style="background:#000080"></div>
        <div class="swatch" style="background:#800080"></div>
        <div class="swatch" style="background:#ffffff"></div>
        <div class="swatch" style="background:#c0c0c0"></div>
        <div class="swatch" style="background:#ff0000"></div>
        <div class="swatch" style="background:#ffff00"></div>
        <div class="swatch" style="background:#00ff00"></div>
        <div class="swatch" style="background:#00ffff"></div>
        <div class="swatch" style="background:#0000ff"></div>
        <div class="swatch" style="background:#ff00ff"></div>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('photoCanvas');
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    const video = document.getElementById('hiddenVideo');
    const statusBox = document.getElementById('statusBox');

    let totalPhotos = 3;
    let capturedImages = [];
    let liveAnimationId = null;
    let isAnimationOff = false;
    let isDitheringEnabled = true;

    const FOOTER_HEIGHT = 100;
    const CANVAS_WIDTH = 384;
    const PHOTO_BOX_HEIGHT = 180;

    async function init() {
      await setupWebcam();
      changeLayout();
    }

    async function setupWebcam() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } },
          audio: false
        });
        video.srcObject = stream;
        video.onloadedmetadata = async () => {
          try {
            await video.play();
            logStatus("Webcam ready.");
          } catch (e) {
            logStatus("Play blocked: Click anywhere on screen.");
          }
        };
      } catch (err) {
        logStatus("Camera Error: " + err.name + " - " + err.message);
      }
    }

    function toggleAnimation(checkbox) {
      isAnimationOff = checkbox.checked;
      if (isAnimationOff) {
        if (liveAnimationId) cancelAnimationFrame(liveAnimationId);
        renderSingleFrame();
        logStatus("Live animation frozen.");
      } else {
        startLiveRenderLoop();
        logStatus("Live animation resumed.");
      }
    }

    function toggleDithering(checkbox) {
      isDitheringEnabled = checkbox.checked;
      if (isAnimationOff) {
        renderSingleFrame();
      }
      logStatus(`Dithering ${isDitheringEnabled ? 'enabled' : 'disabled'}.`);
    }

    function changeLayout() {
      totalPhotos = parseInt(document.getElementById('photoCountSelect').value);
      capturedImages = [];
      canvas.height = (totalPhotos * PHOTO_BOX_HEIGHT) + FOOTER_HEIGHT;
      generateQRCode();
      if (!isAnimationOff) {
        startLiveRenderLoop();
      } else {
        renderSingleFrame();
      }
      logStatus(`Layout set to ${totalPhotos} photos.`);
    }

    function resetPhotos() {
      capturedImages = [];
      if (!isAnimationOff) {
        startLiveRenderLoop();
      } else {
        renderSingleFrame();
      }
      logStatus("Canvas reset.");
    }

    function applyDitheringToCtx(targetCtx, x, y, width, height) {
      const imgData = targetCtx.getImageData(x, y, width, height);
      const data = imgData.data;
      const w = imgData.width;
      const h = imgData.height;

      for (let i = 0; i < data.length; i += 4) {
        const gray = 0.299 * data[i] + 0.587 * data[i + 1] + 0.114 * data[i + 2];
        data[i] = gray;
        data[i + 1] = gray;
        data[i + 2] = gray;
      }

      for (let currentY = 0; currentY < h; currentY++) {
        for (let currentX = 0; currentX < w; currentX++) {
          const idx = (currentY * w + currentX) * 4;
          const oldPixel = data[idx];
          const newPixel = oldPixel < 128 ? 0 : 255;

          data[idx] = newPixel;
          data[idx + 1] = newPixel;
          data[idx + 2] = newPixel;

          const err = oldPixel - newPixel;

          if (currentX + 1 < w) data[idx + 4] += err * (7 / 16);
          if (currentX - 1 >= 0 && currentY + 1 < h) data[idx + (w - 1) * 4] += err * (3 / 16);
          if (currentY + 1 < h) data[idx + w * 4] += err * (5 / 16);
          if (currentX + 1 < w && currentY + 1 < h) data[idx + (w + 1) * 4] += err * (1 / 16);
        }
      }

      targetCtx.putImageData(imgData, x, y);
    }

    function renderSingleFrame() {
      ctx.fillStyle = '#FFFFFF';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      const currentSlot = capturedImages.length;

      for (let i = 0; i < totalPhotos; i++) {
        const yPos = i * PHOTO_BOX_HEIGHT;

        ctx.strokeStyle = '#000000';
        ctx.lineWidth = 2;
        ctx.strokeRect(10, yPos + 10, CANVAS_WIDTH - 20, PHOTO_BOX_HEIGHT - 20);

        if (i < currentSlot) {
          ctx.drawImage(capturedImages[i], 12, yPos + 12, CANVAS_WIDTH - 24, PHOTO_BOX_HEIGHT - 24);
        } else if (i === currentSlot && video.readyState === 4) {
          ctx.save();
          ctx.translate(CANVAS_WIDTH - 12, 0);
          ctx.scale(-1, 1);
          ctx.drawImage(video, 0, yPos + 12, CANVAS_WIDTH - 24, PHOTO_BOX_HEIGHT - 24);
          ctx.restore();

          if (isDitheringEnabled) {
            applyDitheringToCtx(ctx, 12, yPos + 12, CANVAS_WIDTH - 24, PHOTO_BOX_HEIGHT - 24);
          }
        } else {
          ctx.fillStyle = '#F0F0F0';
          ctx.fillRect(12, yPos + 12, CANVAS_WIDTH - 24, PHOTO_BOX_HEIGHT - 24);
        }
      }

      renderFooter();
    }

    function startLiveRenderLoop() {
      if (liveAnimationId) cancelAnimationFrame(liveAnimationId);

      function render() {
        if (isAnimationOff) return;
        renderSingleFrame();
        liveAnimationId = requestAnimationFrame(render);
      }

      render();
    }

    function renderFooter() {
      const footerY = canvas.height - FOOTER_HEIGHT;

      ctx.strokeStyle = '#000000';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(10, footerY);
      ctx.lineTo(CANVAS_WIDTH - 10, footerY);
      ctx.stroke();

      ctx.fillStyle = '#000000';
      ctx.font = 'bold 20px "Courier New"';
      ctx.fillText('Ok Computah', 16, footerY + 38);

      ctx.font = '12px "Courier New"';
      ctx.fillText('@ok.computah', 16, footerY + 58);

      const qrImg = document.querySelector('#qrcode img');
      if (qrImg && qrImg.src) {
        ctx.drawImage(qrImg, CANVAS_WIDTH - 90, footerY + 10, 80, 80);
      }
    }

    function snapPhoto() {
      if (capturedImages.length >= totalPhotos) {
        logStatus("All slots full! Press Print or Reset.");
        return;
      }

      const tempCanvas = document.createElement('canvas');
      tempCanvas.width = CANVAS_WIDTH - 24;
      tempCanvas.height = PHOTO_BOX_HEIGHT - 24;
      const tempCtx = tempCanvas.getContext('2d');

      tempCtx.translate(tempCanvas.width, 0);
      tempCtx.scale(-1, 1);
      tempCtx.drawImage(video, 0, 0, tempCanvas.width, tempCanvas.height);

      if (isDitheringEnabled) {
        applyDitheringToCtx(tempCtx, 0, 0, tempCanvas.width, tempCanvas.height);
      }

      const img = new Image();
      img.src = tempCanvas.toDataURL('image/png');
      img.onload = () => {
        capturedImages.push(img);
        logStatus(`Snapped photo ${capturedImages.length} of ${totalPhotos}.`);
        if (isAnimationOff) renderSingleFrame();
      };
    }

    function generateQRCode() {
      const qrBox = document.getElementById('qrcode');
      qrBox.innerHTML = '';
      const dummyURL = "https://instagram.com/ok.computah";
      new QRCode(qrBox, { text: dummyURL, width: 80, height: 80 });
    }

    // --- WORKING YHK PHOTO STRIP DRIVER ---
    async function connectAndPrint() {
      try {
        logStatus("Scanning for YHK Printer...");

        const SERVICE = "49535343-fe7d-4ae5-8fa9-9fafd205e455";
        const TX = "49535343-8841-43f4-a8d4-ecbe34729bb3";
        const RX = "49535343-1e4d-4bd9-ba61-23c647249616";

        const device = await navigator.bluetooth.requestDevice({
          filters: [{ namePrefix: "YHK" }],
          optionalServices: [SERVICE]
        });

        logStatus("Connecting...");
        const server = await device.gatt.connect();
        const service = await server.getPrimaryService(SERVICE);
        const writeChar = await service.getCharacteristic(TX);

        try {
          const rx = await service.getCharacteristic(RX);
          await rx.startNotifications();
        } catch (e) {}

        const raster = buildCanvasPhotoPayload();
        const job = new Uint8Array(2 + raster.length + 3 + 3);
        job.set([0x1B, 0x40], 0);
        job.set(raster, 2);
        job.set([0x1B, 0x64, 0x04], 2 + raster.length);
        job.set([0x0A, 0x0A, 0x0A], 2 + raster.length + 3);

        logStatus("Printing...");
        await sendDataInChunks(writeChar, job);

        logStatus("Print completed!");
      } catch (err) {
        console.error(err);
        logStatus("Print Error: " + err.message);
      }
    }

    async function sendDataInChunks(characteristic, data) {
      const CHUNK_SIZE = 182;
      const DELAY_MS = 40;
      const FLUSH_MS = 1500;

      for (let i = 0; i < data.length; i += CHUNK_SIZE) {
        await characteristic.writeValueWithoutResponse(data.slice(i, i + CHUNK_SIZE));
        if (i + CHUNK_SIZE < data.length) {
          await new Promise(r => setTimeout(r, DELAY_MS));
        }
      }
      await new Promise(r => setTimeout(r, FLUSH_MS));
    }

    function buildCanvasPhotoPayload() {
      let blackPixels = 0;
      const width = canvas.width;   // 384 px
      const height = canvas.height; 
      const widthBytes = Math.ceil(width / 8);

      const imageData = ctx.getImageData(0, 0, width, height).data;
      const bitmap = new Uint8Array(widthBytes * height);

      let byteIndex = 0;

      for (let y = 0; y < height; y++) {
        for (let x = 0; x < width; x += 8) {
          let byteVal = 0;
          for (let bit = 0; bit < 8; bit++) {
            const px = x + bit;
            if (px >= width) continue;

            const idx = (y * width + px) * 4;
            const r = imageData[idx];
            const g = imageData[idx + 1];
            const b = imageData[idx + 2];
            const brightness = (0.299 * r + 0.587 * g + 0.114 * b);

            if (brightness < 128) {
              blackPixels++;
              byteVal |= (0x80 >> bit);
            }
          }
          bitmap[byteIndex++] = byteVal;
        }
      }

      const header = new Uint8Array([
        0x1D, 0x76, 0x30, 0x00,
        widthBytes & 0xFF, (widthBytes >> 8) & 0xFF,
        height & 0xFF, (height >> 8) & 0xFF
      ]);

      const payload = new Uint8Array(header.length + bitmap.length);
      payload.set(header, 0);
      payload.set(bitmap, header.length);

      console.log("Canvas Raster Encoded - Total Black Pixels:", blackPixels);
      return payload;
    }

    function logStatus(msg) {
      statusBox.innerText = "Status: " + msg;
      statusBox.scrollTop = statusBox.scrollHeight;
    }

    window.onload = init;
  </script>
</body>
</html>
